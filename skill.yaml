# FaceCall Skill 元数据
name: attend
version: 1.0.0
description: 人脸识别考勤 - 自动识别照片中的学生并提交到教务系统
author: scfmac
repository: https://github.com/scfhome/facecall

# Skill 能力
capabilities:
  - face_recognition    # 人脸识别
  - attendance_submit   # 考勤提交
  - batch_processing    # 批量处理

# 命令定义
commands:
  - name: attend
    description: 识别照片中的学生并提交考勤
    usage: /attend @photo.jpg course=体育3 [submit=true] [threshold=0.70]
    parameters:
      photo:
        type: file
        required: true
        description: 班级照片（支持 jpg/png）
      course:
        type: string
        required: true
        description: 课程名称
      submit:
        type: boolean
        required: false
        default: false
        description: 是否自动提交到教务系统
      threshold:
        type: float
        required: false
        default: 0.70
        description: 人脸识别阈值（0.0-1.0）
      database:
        type: string
        required: false
        description: 人脸数据库路径（默认使用配置文件）
      roster:
        type: string
        required: false
        description: 班级名单路径（默认使用配置文件）

# 执行器
executor: executor.py

# 依赖
dependencies:
  python: ">=3.10"
  packages:
    - deepface==0.0.87
    - tensorflow==2.15.0
    - opencv-python==4.9.0.80
    - pillow==10.2.0
    - retina-face==0.0.13
    - requests>=2.31.0
    - pyyaml>=6.0

# 配置文件
config_files:
  - config/config.yaml
  - config/classes.yaml

# 数据目录
data_directories:
  - faces/            # 人脸数据库
  - rosters/          # 班级名单
  - outputs/          # 输出结果

# 标签
tags:
  - face-recognition
  - attendance
  - deepface
  - education
  - automation
